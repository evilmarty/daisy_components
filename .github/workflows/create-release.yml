name: Create Release

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: write

jobs:
  check:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        fetch-depth: 2
    - id: check_file
      run: |
        if git diff-tree --no-commit-id --name-only -r HEAD | grep -q "^mix.exs$"; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
    - id: version
      if: steps.check_file.outputs.changed == 'true'
      run: |
        version=$(sed -n '/version:/s/.*:\s*//p' mix.exs | sed -E 's/(^[^"]*"|"[^"]*$)//g')
        tag="v${version}"
        gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" || (
          echo "new_version=${version}" >> "$GITHUB_OUTPUT"
          echo "new_tag=${tag}" >> "$GITHUB_OUTPUT"
        )
    - name: Create release
      if: steps.check_file.outputs.changed == 'true' && steps.version.outputs.new_version
      uses: softprops/action-gh-release@v3
      with:
        tag_name: "${{steps.version.outputs.new_tag}}"
        target_commitish: ${{github.event.workflow_run.head_sha}}
        generate_release_notes: true
        prerelease: true
